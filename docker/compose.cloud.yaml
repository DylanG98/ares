# Optional managed-cloud trust overlay; certificates are never embedded in images.
services:
  paperclip:
    build:
      secrets: [proxy_ca]
    environment:
      NODE_EXTRA_CA_CERTS: /run/proxy-ca.pem
      SSL_CERT_FILE: /run/proxy-ca.pem
      REQUESTS_CA_BUNDLE: /run/proxy-ca.pem
    volumes:
      - ${CODEX_PROXY_CERT:?}:/run/proxy-ca.pem:ro
  operator:
    build:
      secrets: [proxy_ca]
secrets:
  proxy_ca:
    file: /etc/ssl/certs/ca-certificates.crt
