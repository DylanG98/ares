[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ares-research"
version = "0.1.0"
description = "Research y Valuación: infraestructura auditable para Paperclip y Hermes"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "openpyxl==3.1.5",
  "xlsxwriter==3.2.9",
  "pypdf==6.1.1",
  "pdfplumber==0.11.7",
  "reportlab==4.4.4",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "PyYAML==6.0.3",
]

[project.scripts]
ares = "ares_research.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ares_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
