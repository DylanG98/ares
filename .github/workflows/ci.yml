name: Ares validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv run ares smoke --output artifacts/synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-technical-evidence
          path: artifacts/synthetic
          retention-days: 14
